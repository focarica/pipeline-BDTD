# Mantém o serviço e o volume da carga iniciada antes da cópia para este repositório.
name: trab_final

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    restart: unless-stopped

volumes:
  qdrant_data:
