[project]
name = "pipeline-bdtd"
version = "0.1.0"
description = "Pipeline de tratamendo de dados da BDTD com foco na area de Computação, Informática e Informação; para pré-treino continuado, fine-tuning, RAG e benchmarks de avaliação"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "datasketch>=2.0.0",
    "ftfy>=6.3.1",
    "langdetect>=1.0.9",
    "pypdf>=6.18.0",
    "requests>=2.31,<3",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
